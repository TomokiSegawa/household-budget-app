databases:
  - name: kakeibo-db
    databaseName: kakeibo
    user: kakeibo_user

services:
  - type: web
    name: household-budget-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: kakeibo-db
          property: connectionString
