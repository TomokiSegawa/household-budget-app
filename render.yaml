services:
  - type: web
    name: household-budget-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_PATH
        value: /data/kakeibo.db
    disk:
      name: kakeibo-data
      mountPath: /data
      sizeGB: 1
